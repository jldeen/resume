<!doctype html>
<html lang="{{ site.Language.Locale | default "en-US" }}">
  <head>
    {{- partial "head.html" . }}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {{- block "main" . }}{{ end }}
    {{- partial "footer.html" . }}
    {{- with resources.Get "js/theme.js" | minify | fingerprint }}
    <script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
    {{- end }}
  </body>
</html>
