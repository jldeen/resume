about:
  - At GitHub, I'm part of a small, specialized team embedded in executive cohorts with CEOs, EVPs, and their leadership teams. Whatever the message is (GitHub Copilot, Microsoft Foundry, Fabric, DevOps, or open source), I work out the story, design and build the demos that prove it, and support the keynote workstream from first draft through show day.
  - "Before GitHub, I was a developer advocate at AWS and Microsoft, focused on containers, Kubernetes, serverless, and DevOps, after more than a decade in IT. The topics change; the job doesn't: make complex technology clear, credible, and memorable."

