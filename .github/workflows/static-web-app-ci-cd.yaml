name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

env:
  # The name of the resource group and static site.
  rgName: "resume"

  # The location to store the meta data for the deployment.
  location: "eastus2"

# Deploys share one ARM deployment name and SWA resource, so run them one at a time.
concurrency:
  group: swa-resume-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4

      - name: "Login via Azure CLI"
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "Deploy Resume Infra"
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          deploymentName: ${{ env.rgName }}
          region: ${{ env.location }}
          template: ./main.bicep
          parameters: location=${{ env.location }} rgName=${{ env.rgName }}
          failOnStdErr: false

      - name: "Get deployment token and commit info"
        id: sanitize-outputs
        run: |
          DEPLOYMENT_TOKEN=$(az staticwebapp secrets list --name ${{ env.rgName }} --resource-group ${{ env.rgName }} --query "properties.apiKey" --output tsv)
          echo "::add-mask::$DEPLOYMENT_TOKEN"
          echo "DEPLOYMENT_TOKEN=$DEPLOYMENT_TOKEN" >> "$GITHUB_OUTPUT"

          # Hugo Env Vars
          echo "AUTHORNAME=$(git log -1 --format=%an)" >> $GITHUB_ENV
          echo "COMMITDATE=$(git log -1 --format=%cd --date=format:'%B %d, %Y')" >> $GITHUB_ENV
          echo "COMMITHASH=$(git log -1 --format=%H)" >> $GITHUB_ENV
          echo "COMMITSUBJECT=$(git log -1 --format=%s)" >> $GITHUB_ENV

      # Build on the runner: the SWA build image's glibc is too old for current Hugo releases.
      - name: Install Hugo
        env:
          HUGO_VERSION: 0.168.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build Resume
        env:
          HUGOxPARAMSxGITxLAST_COMMITxAUTHORNAME: ${{ env.AUTHORNAME }}
          HUGOxPARAMSxGITxLAST_COMMITxDATE: ${{ env.COMMITDATE }}
          HUGOxPARAMSxGITxLAST_COMMITxHASH: ${{ env.COMMITHASH }}
          HUGOxPARAMSxGITxLAST_COMMITxSUBJECT: ${{ env.COMMITSUBJECT }}
        run: |
          hugo version
          hugo --gc --minify

      - name: Deploy Resume
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.sanitize-outputs.outputs.DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for GitHub integrations (i.e. PR comments)
          action: "upload"
          app_location: "public" # Prebuilt site
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: "Login via Azure CLI"
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "Get deployment token"
        id: token
        run: |
          DEPLOYMENT_TOKEN=$(az staticwebapp secrets list --name ${{ env.rgName }} --resource-group ${{ env.rgName }} --query "properties.apiKey" --output tsv)
          echo "::add-mask::$DEPLOYMENT_TOKEN"
          echo "DEPLOYMENT_TOKEN=$DEPLOYMENT_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.DEPLOYMENT_TOKEN }}
          action: "close"
